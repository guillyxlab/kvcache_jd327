[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guillyxlab-kvcache_jd327"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "guillyxlab" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://guillyxlab.github.io"
Repository = "https://github.com/guillyxlab/kvcache_jd327"
Issues = "https://github.com/guillyxlab/kvcache_jd327/issues"

[project.scripts]
kvcache_jd327 = "kvcache_jd327:main"

[tool.setuptools]
py-modules = ["kvcache_jd327"]
